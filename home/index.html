<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wraps — Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-indigo-50 h-screen flex items-center justify-center">
<div class="bg-white p-12 rounded-xl shadow-xl w-96 text-center">
    <h2 class="text-3xl font-bold mb-6">Welcome to Wraps</h2>
    <input type="text" id="roomInput" placeholder="Enter Room ID" class="w-full border rounded p-2 mb-4 text-center">
    <div class="flex justify-between">
        <button id="createBtn" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">Create Room</button>
        <button id="joinBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">Join Room</button>
    </div>
</div>

<script src="./home.js" type="module"></script>
</body>
</html>

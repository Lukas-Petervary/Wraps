<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Wraps — Home</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
<div class="max-w-3xl mx-auto">
    <header class="mb-8 flex items-center justify-between">
        <h1 class="text-3xl font-bold">Wraps</h1>
        <div class="text-sm opacity-80" id="user-info"></div>
    </header>

    <main class="bg-slate-800 rounded-xl p-6 shadow-lg">
        <div class="space-y-6">
            <button id="create-room" class="w-full py-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 font-semibold">Create Room</button>

            <div class="flex gap-2">
                <input id="room-id" placeholder="Enter room id or paste invite link" class="flex-1 p-3 rounded-lg bg-slate-900" />
                <button id="join-room" class="px-4 py-3 rounded-lg bg-slate-700 hover:bg-slate-600">Join</button>
            </div>

            <div class="text-sm text-slate-300" id="instructions">
                After creating a room, share the room link (copied automatically) with friends. They can join and will be synced.
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { loadToken } from '../js/auth.js';
    // simple check
    const token = loadToken();
    if (!token) {
        window.location = 'index.html';
    } else {
        document.getElementById('user-info').textContent = 'Signed in';
    }

    document.getElementById('create-room').onclick = () => {
        const id = Math.random().toString(36).substring(2, 9);
        const url = `${location.origin}/Wraps/room#${id}`;
        navigator.clipboard?.writeText(url).catch(()=>{});
        window.location = url;
    };

    document.getElementById('join-room').onclick = () => {
        const raw = document.getElementById('room-id').value.trim();
        if (!raw) return;
        // accept raw room id or a full link
        const match = raw.match(/#([a-z0-9_-]{6,})$/i);
        const id = match ? match[1] : raw;
        window.location = `${location.origin}/Wraps/room#${id}`;
    };
</script>
</body>
</html>

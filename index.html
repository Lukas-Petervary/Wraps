<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wraps — Listen Together</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="./index.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="h-screen w-screen font-sans">
<div class="flex h-full">
  <div class="w-1/2 bg-gradient-to-br from-indigo-700 to-purple-700 text-white flex flex-col justify-center p-16">
    <h1 class="text-6xl font-bold mb-6">Wraps</h1>
    <p class="text-xl mb-8">Listen to Spotify and YouTube together in real-time with friends. Host a room or join one instantly.</p>
    <div class="mb-4">
      <a href="home/" class="px-6 py-3 bg-white text-indigo-700 font-semibold rounded-lg mr-4 hover:bg-gray-200 transition">Enter</a>
      <button id="spotifyLogin" class="px-6 py-3 bg-green-500 rounded-lg text-black font-semibold hover:bg-green-600 mb-4">
        Sign in with Spotify
      </button>
    </div>
  </div>
  <div class="w-1/2 bg-indigo-100 flex items-center justify-center">
    <img src="assets/logo.svg" alt="Wraps Logo" class="w-3/4 h-3/4 object-contain">
  </div>
</div>
</body>
</html>

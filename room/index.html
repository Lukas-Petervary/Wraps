<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Wraps — Room</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="flex items-center justify-between p-4 bg-slate-800/50 border-b border-slate-700">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-semibold">Wraps</h1>
      <div id="roleLabel" class="px-2 py-1 text-xs bg-slate-700 rounded">Role</div>
      <div id="roomIdLabel" class="ml-2 text-sm opacity-80"></div>
    </div>
    <div class="text-sm text-slate-300">Share the room link to invite others</div>
  </header>

  <main class="flex-1 flex gap-4 p-4">
    <section class="flex-1 max-w-3xl">
      <!-- Track & Playback -->
      <div class="bg-slate-800 rounded-lg p-4 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <div id="currentTrack" class="text-lg font-semibold">No track</div>
            <div id="currentArtist" class="text-sm opacity-70"></div>
          </div>
          <div class="text-sm text-slate-400" id="durationLabel">0:00</div>
        </div>

        <!-- Player controls -->
        <div class="flex items-center gap-3">
          <button id="playBtn" class="px-3 py-2 bg-green-500 rounded">Play</button>
          <button id="pauseBtn" class="px-3 py-2 bg-amber-500 rounded">Pause</button>

          <div class="flex-1">
            <input id="seekBar" type="range" min="0" max="100" value="0" step="1" class="w-full" />
            <div class="flex justify-between text-xs text-slate-400 mt-1">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <span class="text-xs opacity-70">Vol</span>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="1" class="w-28" />
          </div>
        </div>

        <!-- Buffer indicator -->
        <div class="text-xs text-slate-400" id="bufferInfo">Buffered: 0%</div>
      </div>

      <!-- Add to queue area -->
      <div class="mt-4 p-4 bg-slate-800 rounded-lg">
        <label class="block text-sm font-medium text-slate-200 mb-2">Add track (YouTube or Spotify URL / ID)</label>

        <div class="flex gap-2">
          <input id="addInput" type="text" placeholder="Paste a YouTube/Spotify link or id" class="flex-1 px-3 py-2 rounded bg-slate-700 text-slate-100" />
          <button id="addBtn" class="px-4 py-2 bg-indigo-600 rounded">Add</button>
        </div>

        <div id="dropZone" class="mt-3 p-4 border-2 border-dashed border-slate-600 rounded text-sm text-slate-400">
          Drag & drop a YouTube or Spotify link here
        </div>
        <div id="addMessage" class="mt-2 text-xs text-amber-300"></div>
      </div>

      <!-- Host Controls -->
      <div id="hostPanel" class="mt-4 p-4 bg-slate-800 rounded-lg hidden">
        <label class="block text-sm font-medium text-slate-200 mb-2">Host Controls</label>

        <div class="grid grid-cols-2 gap-3 text-sm">
          <label class="flex items-center justify-between p-3 bg-slate-700 rounded cursor-pointer col-span-2">
            <span class="text-slate-200">Strict Mode</span>
            <input id="perm-strictMode" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-slate-700 rounded cursor-pointer">
            <span class="text-slate-200">Lock room</span>
            <input id="perm-lockRoom" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-slate-700 rounded cursor-pointer">
            <span class="text-slate-200">Add to Queue</span>
            <input id="perm-addQueue" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-slate-700 rounded cursor-pointer">
            <span class="text-slate-200">Remove from Queue</span>
            <input id="perm-removeQueue" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-slate-700 rounded cursor-pointer">
            <span class="text-slate-200">Rearrange Queue</span>
            <input id="perm-rearrangeQueue" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-slate-700 rounded cursor-pointer">
            <span class="text-slate-200">Pause / Play Song</span>
            <input id="perm-pausePlaySong" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-slate-700 rounded cursor-pointer">
            <span class="text-slate-200">Skip Current Song</span>
            <input id="perm-skipSong" type="checkbox" class="accent-indigo-600">
          </label>
        </div>
      </div>
    </section>

    <!-- Right column: Queue (always visible) -->
    <aside class="w-96">
      <div class="bg-slate-800 rounded-lg p-4 h-full flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold">Queue</h2>
          <div id="queueCount" class="text-sm text-slate-400">0</div>
        </div>

        <ul id="queueList" class="flex-1 overflow-auto space-y-2 pr-2"></ul>

        <div class="mt-4 text-xs text-slate-400">
          <div>Host controls appear for the host only.</div>
          <div class="mt-2">Tip: click a queued item to immediately play.</div>
        </div>
      </div>
    </aside>
  </main>

  <div id="playerContainers" class="visually-hidden" style="position:absolute !important; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;"></div>

  <script type="module" src="index.js"></script>
</body>
</html>

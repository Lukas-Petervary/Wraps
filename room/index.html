<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wraps — Room</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/partials/StaticPartial.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body class="bg-theme text-slate-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="flex items-center justify-between p-4 bg-gradient">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-semibold">Wraps</h1>
      <div id="roleLabel" class="px-2 py-1 text-xs bg-slate-700 rounded">Role</div>
      <div id="roomIdLabel" class="ml-2 text-sm opacity-80"></div>
    </div>
    <div class="text-sm text-slate-300">Share the room link to invite others</div>
  </header>

  <main class="flex-1 flex flex-col lg:flex-row gap-4 p-4">
    <section class="flex-1 max-w-3xl">
      <!-- Track & Playback -->
      <div class="bg-theme2 text-theme rounded-lg p-4 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <div id="currentTrack" class="text-lg font-semibold">No track</div>
            <div id="currentArtist" class="text-sm opacity-70"></div>
          </div>
          <div class="text-sm" id="durationLabel">0:00</div>
        </div>

        <!-- Player controls -->
        <div class="flex items-center gap-3">
          <button id="playBtn" class="px-3 py-2 bg-green-500 rounded">Play</button>
          <button id="pauseBtn" class="px-3 py-2 bg-amber-500 rounded">Pause</button>

          <div class="flex-1">
            <input id="seekBar" type="range" min="0" max="100" value="0" step="1" class="w-full" />
            <div class="flex justify-between text-xs mt-1">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <span class="text-xs opacity-70">Vol</span>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="1" class="w-28" />
          </div>
        </div>

        <!-- Buffer indicator -->
        <div class="text-xs" id="bufferInfo">Buffered: 0%</div>
      </div>

      <!-- Add to queue area -->
      <div class="mt-4 p-4 bg-theme2 text-theme rounded-lg">
        <a class="block text-medium font-medium mb-2">Add track (YouTube or Spotify URL / ID)</a>

        <form id="queueAddForm" class="flex gap-2">
          <input id="addInput" type="text"
                 placeholder="Paste a YouTube/Spotify link or id"
                 class="flex-1 px-3 py-2 rounded bg-theme3 placeholder:text-[var(--text-color2)] placeholder:font-medium"
          />
          <button id="addBtn" type="submit" class="px-4 py-2 bg-[var(--accent-color-primary)] text-white rounded">Add</button>
        </form>
      </div>

      <!-- Host Controls -->
      <div id="hostPanel" class="mt-4 p-4 bg-theme2 rounded-lg hidden">
        <label class="block text-medium font-medium mb-2 text-theme">Host Controls</label>

        <div class="grid grid-cols-2 gap-3 text-sm text-theme2 font-medium">
          <label class="flex items-center justify-between p-3 bg-theme3 rounded cursor-pointer col-span-2">
            <span class="">Strict Mode</span>
            <input id="perm-strictMode" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-theme3 rounded cursor-pointer">
            <span class="">Lock room</span>
            <input id="perm-lockRoom" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-theme3 rounded cursor-pointer">
            <span class="">Add to Queue</span>
            <input id="perm-addQueue" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-theme3 rounded cursor-pointer">
            <span class="">Remove from Queue</span>
            <input id="perm-removeQueue" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-theme3 rounded cursor-pointer">
            <span class="">Rearrange Queue</span>
            <input id="perm-rearrangeQueue" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-theme3 rounded cursor-pointer">
            <span class="">Pause / Play Song</span>
            <input id="perm-pausePlaySong" type="checkbox" class="accent-indigo-600">
          </label>

          <label class="flex items-center justify-between p-3 bg-theme3 rounded cursor-pointer">
            <span class="">Skip Current Song</span>
            <input id="perm-skipSong" type="checkbox" class="accent-indigo-600">
          </label>
        </div>
      </div>
    </section>

    <!-- Right column: Queue (always visible) -->
    <aside class="w-96">
      <div class="bg-theme2 text-theme rounded-lg p-4 h-full flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold">Queue</h2>
          <div id="queueCount" class="text-sm">0</div>
        </div>

        <ul id="queueList" class="flex-1 overflow-auto space-y-2 pr-2"></ul>

        <div class="mt-4 text-xs text-theme">
          <div>Host controls appear for the host only.</div>
          <div class="mt-2">Tip: click a queued item to immediately play.</div>
        </div>
      </div>
    </aside>
  </main>

  <div id="playerContainers" class="visually-hidden" style="position:absolute !important; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;"></div>

  <script src="/assets/css/theme.js"></script>
  <static-partial src="/assets/partials/footer.html"></static-partial>
  <script type="module" src="index.js"></script>
</body>
</html>
